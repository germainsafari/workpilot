services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workpilot
      POSTGRES_USER: workpilot
      POSTGRES_PASSWORD: workpilot-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpilot -d workpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - workpilot-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - workpilot-redis:/data

  api:
    build:
      context: ./apps/api
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    environment:
      WORKPILOT_ENVIRONMENT: local
      WORKPILOT_DATABASE_URL: postgresql+asyncpg://workpilot:workpilot-local@postgres:5432/workpilot
      WORKPILOT_REDIS_URL: redis://redis:6379/0
      WORKPILOT_AUTO_CREATE_SCHEMA: "false"
      WORKPILOT_SEED_DEMO_DATA: "false"
      WORKPILOT_EXECUTE_RUNS_INLINE: "false"
      WORKPILOT_LOCAL_AUTH_ENABLED: "true"
      WORKPILOT_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      WORKPILOT_ENVIRONMENT: local
      WORKPILOT_DATABASE_URL: postgresql+asyncpg://workpilot:workpilot-local@postgres:5432/workpilot
      WORKPILOT_REDIS_URL: redis://redis:6379/0
      WORKPILOT_AUTO_CREATE_SCHEMA: "false"
      WORKPILOT_SEED_DEMO_DATA: "false"
      WORKPILOT_EXECUTE_RUNS_INLINE: "false"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  workpilot-postgres:
  workpilot-redis:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - workpilot-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - workpilot-redis:/data

  api:
    build:
      context: ./apps/api
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    env_file: .env
    environment:
      WORKPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WORKPILOT_REDIS_URL: redis://redis:6379/0
      WORKPILOT_AUTO_CREATE_SCHEMA: "false"
      WORKPILOT_SEED_DEMO_DATA: "false"
      WORKPILOT_EXECUTE_RUNS_INLINE: "false"
      WORKPILOT_AGENT_RUNTIME: bedrock_langgraph
      WORKPILOT_AGENTCORE_RUNTIME_ARN: ${WORKPILOT_AGENTCORE_RUNTIME_ARN:-}
      WORKPILOT_LOCAL_AUTH_ENABLED: "true"
      WORKPILOT_CORS_ORIGINS: ${WORKPILOT_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      WORKPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WORKPILOT_REDIS_URL: redis://redis:6379/0
      WORKPILOT_AUTO_CREATE_SCHEMA: "false"
      WORKPILOT_SEED_DEMO_DATA: "false"
      WORKPILOT_EXECUTE_RUNS_INLINE: "false"
      WORKPILOT_AGENT_RUNTIME: bedrock_langgraph
      WORKPILOT_AGENTCORE_RUNTIME_ARN: ${WORKPILOT_AGENTCORE_RUNTIME_ARN:-}
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  workpilot-postgres:
  workpilot-redis:
